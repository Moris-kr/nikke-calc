name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Python bridge smoke test
        run: python3 scripts/test-bridge.py
      - name: Run Python engine regressions
        working-directory: .
        run: |
          python3 -m unittest calculator.test_customization -v
          python3 calculator/damage.py
          python3 -m context.doclint
          python3 -m context.snapshot
      - name: Run browser-site tests
        run: npm test -- --run
      - name: Build production site
        # 블라블라링크 조회 프록시 주소(`worker/README.md`). 리포지토리 변수에 없으면 빈
        # 값이 되고, 그러면 사이트가 연동 UI를 아예 그리지 않는다 — 프록시 없이는 브라우저가
        # 블라블라링크를 부를 수 없어 버튼만 있고 항상 실패하는 상태가 되기 때문이다.
        env:
          VITE_BLABLA_PROXY: ${{ vars.VITE_BLABLA_PROXY }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
