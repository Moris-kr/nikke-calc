name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      # 계산 엔진은 TypeScript 하나다(site/src/engine/). 엔진 단위 테스트는 사이트 테스트에 들어 있다.
      - name: Run browser-site and engine tests
        run: npm test -- --run
      - name: Run golden damage regressions
        run: npx tsx scripts/snapshot.ts
      - name: Check docs against data and engine
        working-directory: .
        run: python3 -m context.doclint
      - name: Build production site
        # 블라블라링크 프록시 주소는 `site/.env.production`에 있다(`worker/README.md`).
        # 리포지토리 변수로 덮고 싶으면 여기 env를 되살리면 되지만, 빈 변수가 파일을
        # 덮어써 연동이 조용히 꺼지는 사고가 나기 쉬워 기본은 파일 쪽으로 뒀다.
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
