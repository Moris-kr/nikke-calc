<text x="36" y="78" font-size="16" fill="#a6b8ca">설명용 그림 · 실제 사이트 화면은 아래에서 확인하세요</text>
<g fill="#102337" stroke="#2e5266"><rect x="36" y="110" width="310" height="216" rx="14"/><rect x="385" y="110" width="310" height="216" rx="14"/><rect x="734" y="110" width="310" height="216" rx="14"/></g>
<g fill="#45d6d0" font-size="16" font-weight="700"><text x="58" y="145">01 · 계산기</text><text x="407" y="145">02 · ChatGPT / Claude</text><text x="756" y="145">03 · MCP 도구</text></g>
<g font-size="23" font-weight="700"><text x="58" y="191">JSON 내보내기</text><text x="407" y="191">파일 첨부 또는 붙여넣기</text><text x="756" y="191">같은 설정으로 계산</text></g>
<g font-size="17" fill="#c0cfdd"><text x="58" y="231">편의 기능 → MCP</text><text x="58" y="260">전체 육성 · 덱 · 전투 조건</text><text x="407" y="231">연결 확인 프롬프트 실행</text><text x="407" y="260">공유 JSON과 계산 요청 전달</text><text x="756" y="231">공유 데이터 검증</text><text x="756" y="260">덱 번호 선택 → 결과 확인</text></g>
