<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
<title id="title">AI 요청을 내 브라우저에서 계산하는 흐름</title>
<desc id="desc">계산기에서 연결 코드를 발급해 AI에 전달합니다. AI의 요청은 Render를 거쳐 열린 계산기 탭에서 계산됩니다. 결과는 중계 서버를 통해 AI가 조회합니다. 탭을 열어 두세요.</desc>
<rect width="1080" height="460" rx="20" fill="#07111f"/>
<g font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" fill="#eaf2f8">
<text x="36" y="48" font-size="25" font-weight="700">AI는 요청하고, 내 브라우저가 계산합니다</text>
<text x="36" y="80" font-size="16" fill="#a6b8ca">편의 기능 → MCP → AI 연결 · 받은 연결 코드를 AI 대화에 전달하세요</text>
<g fill="#102337" stroke="#2e5266"><rect x="36" y="118" width="225" height="188" rx="14"/><rect x="297" y="118" width="225" height="188" rx="14"/><rect x="558" y="118" width="225" height="188" rx="14"/><rect x="819" y="118" width="225" height="188" rx="14"/></g>
<g fill="#45d6d0" font-size="16" font-weight="700"><text x="54" y="151">01 · 계산기</text><text x="315" y="151">02 · AI 대화</text><text x="576" y="151">03 · Render</text><text x="837" y="151">04 · 내 브라우저</text></g>
<g font-size="21" font-weight="700"><text x="54" y="195">연결 코드 발급</text><text x="315" y="195">조회·계산 요청</text><text x="576" y="195">요청과 결과 중계</text><text x="837" y="195">실제 계산 실행</text></g>
<g font-size="16" fill="#c0cfdd"><text x="54" y="235">육성·덱 준비</text><text x="54" y="265">코드는 공개하지 않기</text><text x="315" y="235">작업 ID 받기</text><text x="315" y="265">완료될 때까지 조회</text><text x="576" y="235">입력 검증 · 임시 보관</text><text x="576" y="265">서버 대신 계산 없음</text><text x="837" y="235">현재 설정으로 실행</text><text x="837" y="265">결과 → 중계 → AI</text></g>
<g stroke="#45d6d0" stroke-width="3" fill="none"><path d="M266 210h25m-8-7 8 7-8 7"/><path d="M527 210h25m-8-7 8 7-8 7"/><path d="M788 210h25m-8-7 8 7-8 7"/><path d="M930 312v26H410v-26m-7 8 7-8 7 8"/></g>
<text x="493" y="365" font-size="16" fill="#a6b8ca">완료 결과를 중계해 AI가 확인</text>
<text x="36" y="405" font-size="17" fill="#ffbf3c">계산기 탭과 기기를 깨워 두세요 · 연결 2시간 · 완료 결과 보관 5분</text>
<text x="36" y="433" font-size="15" fill="#a6b8ca">육성·편성·결과는 AI와 중계 서버를 거칩니다. 사용 후 연결을 해제하세요.</text>
</g></svg>
