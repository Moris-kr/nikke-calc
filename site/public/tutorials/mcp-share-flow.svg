<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc">
<title id="title">내 육성을 AI 계산에 적용하는 세 단계</title><desc id="desc">계산기에서 JSON 내보내기, AI 대화에 첨부, MCP 도구로 계산. 웹 변경 후에는 다시 내보냅니다.</desc>
<rect width="1080" height="400" rx="20" fill="#07111f"/>
<g font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" fill="#eaf2f8">
