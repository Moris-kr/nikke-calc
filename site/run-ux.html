<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>실행 단추 배치 시안</title>
<link rel="stylesheet" href="src/styles.css" />
<style>
  /* ── 시안 껍데기(실제 사이트에는 안 들어감) ────────────────────────── */
  .mock-shell { width: min(1240px, calc(100% - 40px)); margin: 0 auto; padding: 24px 0 80px; }
  .mock-bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 12px 14px;
    margin: 0 0 18px; border: 1px solid var(--line); border-radius: 12px; background: rgba(7,15,25,.6); }
  .mock-bar .filter-title { margin: 0 6px 0 0; }
  .mock-note { margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.75; }
  .mock-note b { color: var(--amber); }
  .mock-stage { display: grid; gap: 16px; }
  .mock-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    width: min(100%, 940px); margin: 0 auto; gap: 10px; }
  .mock-card { height: 168px; border: 1px solid rgba(146,176,201,.15); background:
    linear-gradient(135deg, #18293a, #09131e); border-radius: 4px; }
  .mock-empty { display: grid; place-items: center; gap: 10px; min-height: 220px; text-align: center; }

  /* ── A안 — 조건 줄과 한 몸 ─────────────────────────────────────────── */
  .cond-bar { display: flex; align-items: stretch; gap: 0; }
  .cond-bar .battle-open { border-radius: 8px 0 0 8px; border-right: none; }
  .cond-bar .run-inline { flex: none; display: inline-flex; align-items: center; gap: 10px;
    padding: 0 22px; border: 0; border-radius: 0 8px 8px 0;
    background: linear-gradient(90deg, var(--amber), var(--amber-hot));
    color: #171006; font: 900 13px/1 inherit; cursor: pointer; white-space: nowrap; }
  .cond-bar .run-inline:hover { filter: brightness(1.08); }
  .cond-bar .run-inline.is-running { background: rgba(255,191,60,.25); color: #ffe0a6; }

  /* ── B안 — 결과 자리에서 시작 ──────────────────────────────────────── */
  .result-start { display: grid; place-items: center; gap: 14px; min-height: 260px; }
  .result-start .calculate-button { width: auto; min-width: 320px; margin: 0; border-radius: 10px; }
  .result-redo { display: flex; align-items: center; gap: 10px; }
  .result-redo .redo { padding: 8px 16px; border: 1px solid rgba(255,191,60,.4); border-radius: 8px;
    background: rgba(255,191,60,.14); color: var(--amber); font: 800 11px ui-monospace, monospace; cursor: pointer; }

  /* ── C안 — 떠 있는 실행 바 ─────────────────────────────────────────── */
  .run-dock { position: sticky; bottom: 14px; z-index: 30; display: flex; align-items: center;
    justify-content: center; gap: 14px; margin-top: 8px; padding: 10px 14px;
    border: 1px solid rgba(255,191,60,.3); border-radius: 12px;
    background: rgba(8,19,31,.82); backdrop-filter: blur(8px);
    box-shadow: 0 18px 40px rgba(0,0,0,.5); }
  .run-dock .calculate-button { width: auto; min-width: 260px; margin: 0; border-radius: 9px; min-height: 46px; }
  .run-dock .dock-status { color: var(--muted); font: 600 11px ui-monospace, monospace; }
</style>
</head>
<body>
<div class="mock-shell">
  <p class="eyebrow">UX 시안 · <span>시뮬레이션 실행 단추</span></p>
  <h1 style="margin:0 0 6px;font-size:26px;letter-spacing:-.03em;">실행 단추를 어디에 둘까</h1>
  <p class="mock-note" style="margin:0 0 16px;">실제 사이트 CSS를 그대로 쓴 <b>동작하는 시안</b>입니다 — 단추를 누르면 계산 중 상태까지 그대로 흘러갑니다.</p>

  <div class="mock-bar">
    <p class="filter-title">시안</p>
    <div class="filter-chips" id="plan-chips"></div>
  </div>

  <div id="stage" class="mock-stage"></div>
  <p class="mock-note" id="plan-note"></p>
</div>

<script type="module">
const PLANS = {
  A: {
    label: 'A · 조건 줄과 한 몸',
    note: '<b>A안</b> — 조건 줄과 실행을 하나의 막대로 붙입니다. 「이 조건으로 → 실행」이 한 줄로 읽히고, 패널 사이에 단추만 덩그러니 끼는 자리가 사라집니다. 대신 조건 줄이 길어져 요약이 조금 짧게 잘립니다.',
  },
  B: {
    label: 'B · 결과 자리에서 시작',
    note: '<b>B안</b> — 결과가 없을 때 03 RESULT 자리 한가운데가 실행 단추입니다. 결과를 얻는 행위가 결과 자리에서 일어나 가장 자연스럽고, 빈 패널의 허전함도 함께 없앱니다. 결과가 나오면 헤더 구석의 작은 「다시 계산」으로 물러납니다. 대신 처음 쓰는 사람은 아래까지 내려가야 실행을 만납니다.',
  },
  C: {
    label: 'C · 떠 있는 실행 바',
    note: '<b>C안</b> — 화면 아래에 붙어 따라다니는 얇은 바입니다. 어디를 보고 있든 누를 수 있고 레이아웃을 전혀 건드리지 않습니다. 대신 늘 떠 있어 화면을 조금 가리고, 「차례대로 누른다」는 흐름은 약해집니다.',
  },
};

let plan = 'A';
let state = 'idle';   // idle · running · done

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const condLine = (extra = '') => `
  <button type="button" class="battle-open">
    <span class="battle-open-label">전투 조건</span>
    <span class="battle-summary">180초 · 무속성 · 코어 없음 · 기대값</span>
    <span class="disclosure-hint">열기 ›</span>
  </button>${extra}`;

const targetHead = `
  <div class="section-heading compact target-heading">
    <div><p class="step">01 / TARGET</p><h2>전투 조건</h2></div>
    <div class="target-actions">
      <button type="button" class="reset-enemy">전투 조건 공유</button>
      <button type="button" class="reset-enemy">적 수치 초기화</button>
    </div>
  </div>`;

const squadPanel = `
  <section class="panel squad-panel">
    <div class="section-heading">
      <div><p class="step">02 / SQUAD</p><h2>편성 및 캐릭터 설정</h2></div>
      <div class="squad-tools"><button type="button" class="roster-import">조합 공유</button></div>
    </div>
    <div class="mock-cards">${'<div class="mock-card"></div>'.repeat(5)}</div>
  </section>`;

const runLabel = () => (state === 'running' ? '계산 중…' : state === 'done' ? '다시 계산' : '시뮬레이션 실행');
const statusLine = () => (state === 'running' ? '덱 1/1 계산 중…'
  : state === 'done' ? '계산 완료 · 같은 조건은 이 기기에 저장됩니다.'
    : '계산 준비 완료 · 모든 연산은 이 기기에서 실행됩니다.');

function resultPanel(inner) {
  return `<section class="panel result-panel">${inner}</section>`;
}

const resultDone = `
  <div class="result-header">
    <div><p class="step">03 / RESULT</p><h2>전투 결과</h2></div>
    <div class="total-block"><span>스쿼드 총 대미지</span><strong>1,482,905,113</strong><small>8.2M DPS</small></div>
  </div>`;

const resultEmpty = `
  <div class="result-empty mock-empty">
    <p class="step">03 / RESULT</p><h2>전투 결과</h2>
    <p>편성과 조건을 확인한 뒤<br />시뮬레이션을 실행해 주세요.</p>
  </div>`;

function render() {
  const stage = document.getElementById('stage');
  if (plan === 'A') {
    stage.innerHTML = `
      <section class="panel settings-panel">
        ${targetHead}
        <div class="cond-bar">
          ${condLine(`<button type="button" class="run-inline${state === 'running' ? ' is-running' : ''}" data-run>${esc(runLabel())} →</button>`)}
        </div>
        <p class="status" style="margin:10px 0 0;">${esc(statusLine())}</p>
      </section>
      ${squadPanel}
      ${resultPanel(state === 'done' ? resultDone : resultEmpty)}`;
  } else if (plan === 'B') {
    stage.innerHTML = `
      <section class="panel settings-panel">
        ${targetHead}
        ${condLine()}
      </section>
      ${squadPanel}
      ${resultPanel(state === 'done' ? `
        <div class="result-header">
          <div><p class="step">03 / RESULT</p><h2>전투 결과</h2></div>
          <div class="result-redo">
            <span class="status" style="margin:0">${esc(statusLine())}</span>
            <button type="button" class="redo" data-run>다시 계산 ↻</button>
          </div>
        </div>` : `
        <div class="result-start">
          <div style="text-align:center">
            <p class="step">03 / RESULT</p><h2>전투 결과</h2>
          </div>
          <button class="calculate-button" type="button" data-run><span>${esc(runLabel())}</span><b>→</b></button>
          <p class="status" style="margin:0">${esc(statusLine())}</p>
        </div>`)}`;
  } else {
    stage.innerHTML = `
      <section class="panel settings-panel">
        ${targetHead}
        ${condLine()}
      </section>
      ${squadPanel}
      ${resultPanel(state === 'done' ? resultDone : resultEmpty)}
      <div class="run-dock">
        <button class="calculate-button" type="button" data-run><span>${esc(runLabel())}</span><b>→</b></button>
        <span class="dock-status">${esc(statusLine())}</span>
      </div>`;
  }

  document.getElementById('plan-chips').innerHTML = Object.entries(PLANS)
    .map(([key, p]) => `<button type="button" class="filter-chip${key === plan ? ' is-on' : ''}" data-plan="${key}">${p.label}</button>`).join('');
  document.getElementById('plan-note').innerHTML = PLANS[plan].note;
}

document.addEventListener('click', (event) => {
  const target = event.target instanceof Element ? event.target : null;
  if (!target) return;
  const planBtn = target.closest('[data-plan]');
  if (planBtn) { plan = planBtn.dataset.plan; state = 'idle'; render(); return; }
  if (target.closest('[data-run]')) {
    state = 'running';
    render();
    setTimeout(() => { state = 'done'; render(); }, 1200);
  }
});

render();
</script>
</body>
</html>
